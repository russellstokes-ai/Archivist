name: Recovery Source Export
on:
  push:
    branches:
      - recovery/export-pre010-20260930
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude='*.apk' -czf /tmp/archivist-pre010-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: archivist-pre010-source
          path: /tmp/archivist-pre010-source.tar.gz
          retention-days: 7
