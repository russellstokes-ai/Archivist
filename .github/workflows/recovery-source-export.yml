name: Recovery Source Export
on:
  push:
    branches:
      - recovery/export-pre010-20260930
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package source
        run: tar --exclude=.git --exclude=node_modules --exclude='*.apk' -czf /tmp/archivist-pre010-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: archivist-pre010-source
          path: /tmp/archivist-pre010-source.tar.gz
          retention-days: 7
  mobile-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install exact mobile dependencies
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Package dependency tree
        run: tar -C mobile -czf /tmp/archivist-mobile-node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: archivist-mobile-node-modules
          path: /tmp/archivist-mobile-node-modules.tar.gz
          retention-days: 2
