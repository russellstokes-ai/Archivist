name: Mobile checks

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile tests
        working-directory: mobile
        run: npm test

      - name: Version consistency
        working-directory: mobile
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          if(pkg.version!==app.expo.version){
            throw new Error(`Version mismatch: package.json=${pkg.version}, app.json=${app.expo.version}`);
          }
          console.log('Archivist mobile version:',pkg.version);
          NODE

      - name: Expo web bundle
        working-directory: mobile
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/archivist-web"
