name: Mobile checks

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile tests
        working-directory: mobile
        run: |
          node core.test.cjs
          node queue.test.cjs
          node local-library.test.cjs
          node local-reader.test.cjs
          node native-patch.test.cjs
