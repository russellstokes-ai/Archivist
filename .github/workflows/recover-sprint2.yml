name: Recover Sprint 2 Patch
on:
  push:
    branches:
      - validation/sprint2-shelf-library
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Salvage truncated patch
        run: |
          cat .ci/sprint2/part-* > /tmp/sprint2.b64
          base64 -d /tmp/sprint2.b64 > /tmp/sprint2.patch.gz
          gzip -dc /tmp/sprint2.patch.gz > /tmp/sprint2.partial.patch || true
          echo "Recovered bytes: $(wc -c < /tmp/sprint2.partial.patch)"
          echo "Recovered lines: $(wc -l < /tmp/sprint2.partial.patch)"
          echo "Files present:"
          grep '^diff --git ' /tmp/sprint2.partial.patch || true
      - uses: actions/upload-artifact@v4
        with:
          name: salvaged-sprint2-partial-patch
          path: /tmp/sprint2.partial.patch
          retention-days: 30
