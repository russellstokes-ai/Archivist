name: Recover Sprint 2 Patch
on:
  push:
    branches:
      - validation/sprint2-shelf-library
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct patch
        run: |
          cat .ci/sprint2/part-* > /tmp/sprint2.b64
          base64 -d /tmp/sprint2.b64 > /tmp/sprint2.patch.gz
          gzip -t /tmp/sprint2.patch.gz
          gunzip -c /tmp/sprint2.patch.gz > /tmp/sprint2.patch
          echo "Patch bytes: $(wc -c < /tmp/sprint2.patch)"
          echo "Patch lines: $(wc -l < /tmp/sprint2.patch)"
          git apply --stat /tmp/sprint2.patch
          git apply --check /tmp/sprint2.patch
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-sprint2-patch
          path: /tmp/sprint2.patch
          retention-days: 30
