name: Archivist Living Book actual-size test APK
on:
  push:
    branches: ['fix/living-book-render-scale-20261011']
    paths: ['.github/workflows/living-book-scale-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: living-book-scale-preview
  cancel-in-progress: false
jobs:
  book-scale-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Verify source and mobile checks
        working-directory: mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install --no-audit --no-fund
          node harden-forge.cjs
          npm run typecheck
          npm test
      - name: Check Android compatibility
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease -PlivingBookScalePreview=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Build isolated Fold test APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PlivingBookScalePreview=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Verify package, signing and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p living-book-scale-delivery
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > living-book-scale-delivery/package.txt
          grep -q "name='app.archivist.reader.bookscale'" living-book-scale-delivery/package.txt
          grep -q "native-code:.*'arm64-v8a'" living-book-scale-delivery/package.txt
          cp "$APK" living-book-scale-delivery/Archivist-Living-Book-Scaled-${SOURCE_SHA:0:7}.apk
          cd living-book-scale-delivery
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source: %s\nExperimental Living Book size test: uniform 1.16x magnification of the ACTUAL illustrated mesh at canvas rendering; original cover/page-turn/shading/motion, all fixed stage dimensions and player controls preserved. Canonical df4c39b unmodified.\nAutomated checks: mobile suites, typecheck, release lint, package, signature and alignment. This is not an accepted production or canonical build. Physical Fold/phone animation-size and clipping acceptance pending.\nUses unique isolated app.archivist.reader.bookscale package; cannot overwrite the canonical app or scanner-acceptance app; separate empty test data.\n' "$SOURCE_SHA" > TEST-NOTES.txt
      - name: Provide direct test APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=living-book-scale-preview-${SOURCE_SHA:0:7}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title 'Archivist Living Book actual-size test — unvalidated' --notes-file living-book-scale-delivery/TEST-NOTES.txt
          gh release upload "$TAG" living-book-scale-delivery/*.apk living-book-scale-delivery/SHA256SUMS.txt living-book-scale-delivery/TEST-NOTES.txt --clobber
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-book-scale-preview-${{ github.sha }}
          path: |
            living-book-scale-delivery/
            mobile/android/app/build/reports/lint-results-release.*
          retention-days: 14
