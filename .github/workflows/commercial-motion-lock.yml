name: Sync reviewed Lottie package lock on polish branch
on:
  push:
    branches: ['feat/commercial-motion-and-reliability-20261011']
    paths:
      - 'mobile/package.json'
      - '.github/workflows/commercial-motion-lock.yml'
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'russellstokes-ai/Archivist'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install exact dependencies and lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only reviewed lockfile to disposable polish branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/commercial-motion-and-reliability-20261011'
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(motion): synchronize exact lottie-react-native 7.3.8 dependency lock'
          git push origin HEAD:refs/heads/feat/commercial-motion-and-reliability-20261011
