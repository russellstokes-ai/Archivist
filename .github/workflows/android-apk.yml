name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile JS tests
        working-directory: mobile
        run: |
          node core.test.cjs
          node queue.test.cjs
          node local-library.test.cjs
          node local-reader.test.cjs
          node native-patch.test.cjs

      - name: Read app version
        id: app_version
        working-directory: mobile/android
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName ' app/build.gradle | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Launch release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: |
            set -eu
            APK=$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
            test -n "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop app.archivist.reader
            adb shell am start -W -n app.archivist.reader/.MainActivity
            sleep 15
            PID=$(adb shell pidof app.archivist.reader | tr -d '\r')
            if [ -z "$PID" ]; then
              echo "Archivist process exited after launch"
              adb logcat -d -t 600
              exit 1
            fi
            if ! adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'app.archivist.reader'; then
              echo "Archivist did not remain as the resumed activity"
              adb logcat --pid="$PID" -d -t 600 || true
              exit 1
            fi
            APP_LOG=$(adb logcat --pid="$PID" -d -v brief || true)
            printf '%s\n' "$APP_LOG"
            if printf '%s\n' "$APP_LOG" | grep -Eiq 'FATAL EXCEPTION|UnsatisfiedLinkError|Unable to load script|ReactNativeJS.*(TypeError|ReferenceError|Invariant Violation)'; then
              echo "Archivist emitted a fatal startup error"
              exit 1
            fi
            echo "Archivist release APK passed launch smoke test (PID $PID)"

      - name: Name versioned APK
        shell: bash
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          cp "$APK" "mobile/android/app/build/outputs/apk/release/Archivist-${{ steps.app_version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-${{ steps.app_version.outputs.version }}-APK
          path: mobile/android/app/build/outputs/apk/release/Archivist-${{ steps.app_version.outputs.version }}.apk
          if-no-files-found: error
