name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Runtime dependency audit
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile JS tests
        working-directory: mobile
        run: |
          node core.test.cjs
          node queue.test.cjs
          node local-library.test.cjs
          node local-works.test.cjs
          node atlas.test.cjs
          node duplicates.test.cjs
          node local-reader.test.cjs
          node profile-stats.test.cjs
          node server-compatibility.test.cjs
          node state-store.test.cjs
          node speech-focus.test.cjs
          node offline-library.test.cjs
          node native-patch.test.cjs
          node ui-contract.test.cjs

      - name: Read app version
        id: app_version
        working-directory: mobile/android
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName ' app/build.gradle | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const version=(gradle.match(/versionName\s+"([^"]+)"/)||[])[1];
          if(!version || pkg.version!==version || app.expo.version!==version || lock.version!==version || lock.packages?.['']?.version!==version){
            throw new Error('Release version metadata is inconsistent');
          }
          console.log('Release version metadata:',version);
          NODE

      - name: Android release lint
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Locate release APK
        id: release_apk
        shell: bash
        run: |
          set -eu
          APK=$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' -print | head -n 1)
          test -n "$APK"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found release APK: $APK"

      - name: Verify release APK package, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          VERSION="${{ steps.app_version.outputs.version }}"
          CODE=$(grep -m1 'versionCode ' mobile/android/app/build.gradle | awk '{print $2}')
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='app.archivist.reader'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          PERMISSIONS="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS" | grep -F "android.permission.POST_NOTIFICATIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -Fq "android.permission.RECORD_AUDIO"; then
            echo "Release APK unexpectedly requests microphone access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libreactnative.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libreactnative.so'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86)/'; then
            echo "Unexpected legacy ABI in release APK"
            exit 1
          fi

      - name: Launch release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: bash .github/scripts/android-emulator-smoke.sh "${{ github.workspace }}/${{ steps.release_apk.outputs.path }}"

      - name: Name and checksum versioned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          OUT="mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-${{ steps.app_version.outputs.version }}-APK
          path: |
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}.apk
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}.apk.sha256
          if-no-files-found: error
