name: Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/archivist-work
      - build/final-apk-0.9.4-20261004
      - build/0.9.4-test6-20261004
      - fix/test5-reader-player-blockers
      - fix/device-player-metadata-reader-20261005
      - build/0.9.4-test8-android-auto-20261005
      - build/0.9.4-test9-20261005
      - build/0.9.4-test10-20261005
      - build/0.9.4-test12-20261005
      - build/0.9.4-test13-20261005
      - build/test13-media-pipeline-20261006
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-emulator-smoke.sh'

permissions:
  contents: write

env:
  TEST_BUILD: '13'

concurrency:
  group: android-apk-fast-properties-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Runtime dependency audit
        working-directory: mobile
        run: node audit-runtime.cjs

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile JS tests
        working-directory: mobile
        run: npm test

      - name: Read app version
        id: app_version
        working-directory: mobile/android
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName ' app/build.gradle | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const version=(gradle.match(/versionName\s+"([^"]+)"/)||[])[1];
          if(!version || pkg.version!==version || app.expo.version!==version){
            throw new Error('Release version metadata is inconsistent');
          }
          console.log('Release version metadata:',version);
          NODE

      - name: Android test-release lint
        if: false
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Build test release APK (debug-signed)
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Declare test signing
        run: |
          echo "Archivist testing APK: optimized release variant signed with the repository debug key."
          echo "This artifact is for device acceptance only, not Google Play publication."

      - name: Locate test APK
        id: release_apk
        shell: bash
        run: |
          set -eu
          APK=$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' -print | head -n 1)
          test -n "$APK"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found release APK: $APK"

      - name: Verify test APK package, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          VERSION="${{ steps.app_version.outputs.version }}"
          CODE=$(grep -m1 'versionCode ' mobile/android/app/build.gradle | awk '{print $2}' | tr -d '\r')
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          BADGING="$(sed -n '1p' "$RUNNER_TEMP/apk-badging.txt")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='app.archivist.reader'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          PERMISSIONS="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS" | grep -F "android.permission.POST_NOTIFICATIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -Fq "android.permission.RECORD_AUDIO"; then
            echo "Release APK unexpectedly requests microphone access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/arm64-v8a/libreactnative.so' "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/x86_64/libreactnative.so' "$RUNNER_TEMP/apk-contents.txt"
          if grep -Eq 'lib/(armeabi-v7a|x86)/' "$RUNNER_TEMP/apk-contents.txt"; then
            echo "Unexpected legacy ABI in release APK"
            exit 1
          fi

      - name: Name and checksum versioned test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          OUT="mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-${{ steps.app_version.outputs.version }}-Test-${{ env.TEST_BUILD }}-APK
          path: |
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Launch test APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: bash .github/scripts/android-emulator-smoke.sh "${{ github.workspace }}/${{ steps.release_apk.outputs.path }}"

      - name: Publish tested APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.app_version.outputs.version }}
          TEST_BUILD: ${{ env.TEST_BUILD }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}-testing.${TEST_BUILD}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Archivist $VERSION test build ${TEST_BUILD}" --notes "Archivist $VERSION test build ${TEST_BUILD}. Android testing APK with verified signature, package checks and emulator launch. Uses the repository test signing key. Physical-device acceptance remains outstanding."
          fi
          gh release upload "$TAG" "mobile/android/app/build/outputs/apk/Archivist-${VERSION}-test-${TEST_BUILD}.apk" "mobile/android/app/build/outputs/apk/Archivist-${VERSION}-test-${TEST_BUILD}.apk.sha256" --clobber

