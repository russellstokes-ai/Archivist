name: Android QA APK (manual only)

# No automatic QA APK publication when main or another branch changes. The
# owner must explicitly run the workflow with a separate-device QA package.
on:
  workflow_dispatch:
    inputs:
      qa_confirmation:
        description: "Build a debug-key-signed .qa test package only (not for Play)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  TEST_BUILD: '14'
  ARCHIVIST_QA_VISUAL_CAPTURE: '1'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build Android QA-only APK
    if: ${{ inputs.qa_confirmation == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Runtime dependency audit
        working-directory: mobile
        run: node audit-runtime.cjs

      - name: Mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Mobile JS tests
        working-directory: mobile
        run: npm test

      - name: Read app version
        id: app_version
        working-directory: mobile/android
        shell: bash
        run: |
          VERSION=$(grep -m1 'versionName ' app/build.gradle | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version metadata
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const gradle=fs.readFileSync('android/app/build.gradle','utf8');
          const version=(gradle.match(/versionName\s+"([^"]+)"/)||[])[1];
          if(!version || pkg.version!==version || app.expo.version!==version){
            throw new Error('Release version metadata is inconsistent');
          }
          console.log('Release version metadata:',version);
          NODE

      - name: Android test-release lint
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 -ParchivistQATest=true

      - name: Build test release APK (debug-signed)
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 -ParchivistQATest=true

      - name: Declare test signing
        run: |
          echo "Archivist testing APK: optimized release variant signed with the repository debug key."
          echo "This artifact is for device acceptance only, not Google Play publication."

      - name: Locate test APK
        id: release_apk
        shell: bash
        run: |
          set -eu
          APK=$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' -print | head -n 1)
          test -n "$APK"
          test -f "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found release APK: $APK"

      - name: Verify test APK package, signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          VERSION="${{ steps.app_version.outputs.version }}"
          CODE=$(grep -m1 'versionCode ' mobile/android/app/build.gradle | awk '{print $2}' | tr -d '\r')
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          BADGING="$(sed -n '1p' "$RUNNER_TEMP/apk-badging.txt")"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -F "package: name='app.archivist.reader.qa'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$VERSION'"
          PERMISSIONS="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS" | grep -F "android.permission.POST_NOTIFICATIONS"
          if printf '%s\n' "$PERMISSIONS" | grep -Fq "android.permission.RECORD_AUDIO"; then
            echo "Release APK unexpectedly requests microphone access"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -F 'CN=Android Debug'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/arm64-v8a/libreactnative.so' "$RUNNER_TEMP/apk-contents.txt"
          grep -q 'lib/x86_64/libreactnative.so' "$RUNNER_TEMP/apk-contents.txt"
          if grep -Eq 'lib/(armeabi-v7a|x86)/' "$RUNNER_TEMP/apk-contents.txt"; then
            echo "Unexpected legacy ABI in release APK"
            exit 1
          fi
          unzip -oq "$APK" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/archivist-qa-native"
          node scripts/check-16kb-native-libs.cjs "$RUNNER_TEMP/archivist-qa-native/lib/arm64-v8a"

      - name: Name and checksum versioned test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_apk.outputs.path }}"
          OUT="mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-${{ steps.app_version.outputs.version }}-Test-${{ env.TEST_BUILD }}-APK
          path: |
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk
            mobile/android/app/build/outputs/apk/Archivist-${{ steps.app_version.outputs.version }}-test-${{ env.TEST_BUILD }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Launch test APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: bash .github/scripts/android-emulator-smoke.sh "${{ github.workspace }}/${{ steps.release_apk.outputs.path }}" app.archivist.reader.qa

      - name: Upload Android startup frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test14-Android-Splash-Emulator-Frames
          path: ${{ runner.temp }}/test14-android-splash/frame-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm no public release
        run: echo "Private QA artifact uploaded only to this workflow run; Google Play/release publication is disabled."
