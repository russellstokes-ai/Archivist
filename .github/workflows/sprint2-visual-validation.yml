name: Sprint 2 Visual Validation

on:
  push:
    branches:
      - validation/sprint2-shelf-library
    paths:
      - '.github/validation/sprint2-mobile.patch.gz.b64'
      - '.github/workflows/sprint2-visual-validation.yml'
  workflow_dispatch:

concurrency:
  group: sprint2-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_ARCHIVIST_VISUAL_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Apply isolated Sprint 2 source
        shell: bash
        run: |
          base64 -d .github/validation/sprint2-mobile.patch.gz.b64 | gzip -d > /tmp/sprint2-mobile.patch
          git apply --check /tmp/sprint2-mobile.patch
          git apply /tmp/sprint2-mobile.patch

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          yes | sdkmanager --licenses >/dev/null

      - name: Install and validate mobile
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck
          for f in *.test.cjs; do node "$f"; done

      - name: Build visual-fixture APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -PreactNativeArchitectures=x86_64

      - name: Capture Shelf and Library
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            mkdir -p visual-screenshots
            APK=$(find mobile/android/app/build/outputs/apk -type f -name '*.apk' | head -n1)
            adb install -r "$APK"
            adb shell am force-stop app.archivist.reader
            adb shell monkey -p app.archivist.reader -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > visual-screenshots/phone-shelf.png

            tap_label() {
              LABEL="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              python3 - "$LABEL" <<'PY'
import re, subprocess, sys, xml.etree.ElementTree as ET
label=sys.argv[1]
root=ET.parse('/tmp/window.xml').getroot()
for node in root.iter('node'):
    if node.attrib.get('content-desc')==label or node.attrib.get('text')==label:
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',node.attrib.get('bounds',''))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            subprocess.check_call(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)])
            sys.exit(0)
raise SystemExit('Could not find '+label)
PY
            }

            tap_label Library
            sleep 2
            adb exec-out screencap -p > visual-screenshots/phone-library.png

            adb shell wm size 1800x2208
            adb shell wm density 320
            adb shell am force-stop app.archivist.reader
            adb shell monkey -p app.archivist.reader -c android.intent.category.LAUNCHER 1
            sleep 4
            tap_label Shelf
            sleep 2
            adb exec-out screencap -p > visual-screenshots/fold-open-shelf.png
            tap_label Library
            sleep 2
            adb exec-out screencap -p > visual-screenshots/fold-open-library.png
            adb shell wm size reset
            adb shell wm density reset

      - uses: actions/upload-artifact@v4
        with:
          name: sprint2-shelf-library-screenshots
          path: visual-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
