name: Fresh scanner Android native lab
on:
  push:
    branches: ['feature/archivist-scanner-vnext-real-library']
    paths: ['mobile/scanner-test-lab/**', 'mobile/android/app/src/main/java/app/archivist/reader/Scanner*.java', '.github/workflows/scanner-native-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-native-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-saf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated native test app
        working-directory: mobile/android
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew -p ../scanner-test-lab :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Test real Android provider calls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd mobile/android
            ./gradlew -p ../scanner-test-lab :app:connectedDebugAndroidTest --console=plain
      - name: Collect Android diagnostics
        if: always()
        run: |
          mkdir -p scanner-native-results
          adb logcat -d -s ScannerVNextLab:I '*:S' > scanner-native-results/metrics.log || true
          adb shell dumpsys meminfo app.archivist.scannerlab > scanner-native-results/memory.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-native-reports-${{ github.sha }}
          path: |
            mobile/scanner-test-lab/app/build/reports/androidTests/
            mobile/scanner-test-lab/app/build/outputs/androidTest-results/
            scanner-native-results/
          retention-days: 7
