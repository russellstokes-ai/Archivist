name: Archivist Test14 vs Test23 — 342 Real MP3s

on:
  workflow_dispatch:
  push:
    branches:
      - test/android-emulator-media-acceptance-20261008
      - test/android-emulator-kvm-342-20261008
      - test/test14-real-android-342-comparison-20261009
    paths:
      - '.github/workflows/android-media-acceptance.yml'
      - '.github/scripts/android-fixture-media.py'
      - '.github/scripts/android-media-acceptance.py'

permissions:
  contents: write

concurrency:
  group: android-media-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-acceptance:
    name: Exact Test 14 native scanner — 342 real MP3s
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout isolated acceptance branch
        uses: actions/checkout@v5

      - name: Python for test fixture and native UI driver
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact Test 14 APK artifact from user-provided run 37594231281
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p android-acceptance-input android-acceptance-results
          gh run download 37594231281 \
            --repo 'russellstokes-ai/Archivist' \
            --name 'Archivist-0.9.4-Test-14-scanner-APK' \
            --dir 'android-acceptance-input'
          test "$(find android-acceptance-input -type f -name '*.apk' | wc -l)" -eq 1
          find android-acceptance-input -type f -name '*.apk' -exec sha256sum '{}' ';'
          find android-acceptance-input -type f -name '*.apk' -printf 'Original Test14 APK: %p (%s bytes)\n'
          echo "Exact APK downloaded from original successful workflow run 37594231281; no rebuild."

      - name: Generate 342-file diagnostic-reproduction suite plus 227-file controls
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          python -m pip install --disable-pip-version-check 'mutagen==1.47.0'
          python .github/scripts/android-fixture-media.py android-media-fixtures
          test "$(find android-media-fixtures/grouped -type f -name '*.mp3' | wc -l)" -eq 227
          test "$(find android-media-fixtures/split-discs -type f -name '*.mp3' | wc -l)" -eq 227
          test "$(find android-media-fixtures/diagnostic342 -type f -name '*.mp3' | wc -l)" -eq 342

      - name: Enable KVM hardware acceleration for real emulator testing
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM device permissions:"
            ls -l /dev/kvm
          else
            echo "::warning::KVM is not available; Android emulator will be software emulated."
          fi

      - name: Run exact Test 14 APK using legacy Prepare library Android onboarding
        id: emulator_acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: 14214601
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash -lc 'LEGACY_TEST14=1 FIXTURE_PROFILES=diagnostic342 python3 .github/scripts/android-media-acceptance.py "$(find "$GITHUB_WORKSPACE/android-acceptance-input" -type f -name "*.apk" -print -quit)"'

      - name: Produce acceptance summary regardless of pass or failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          report=Path("android-acceptance-results/summary.json")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              print("### Android native media acceptance",file=f)
              if report.exists():
                  summary=json.loads(report.read_text())
                  for case in summary.get("results",[]):
                      print(f"- **{case.get('profile')}** — {case.get('status')}; native review count: {case.get('review_count')}; failure: {case.get('reason','none')}",file=f)
                  print(json.dumps(summary)[:12000])
              else:
                  print("Acceptance driver did not finish. Inspect workflow emulator log and artifacts.",file=f)
          PY

      - name: Upload Android screenshots, stage timings, DB aggregates and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Archivist-Test14-342-MP3-Android-Comparison
          path: |
            android-acceptance-results/
            android-media-fixtures/manifest.json
          retention-days: 30
          if-no-files-found: warn

      - name: Commit synthetic-fixture evidence to isolated branch
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("android-acceptance-results")
          dest=Path("docs/qa-evidence/test14-android-comparison")
          dest.mkdir(parents=True,exist_ok=True)
          if (root/"summary.json").exists():shutil.copyfile(root/"summary.json",dest/"summary.json")
          for profile in ("diagnostic342","grouped","split-discs"):
              src=root/profile
              if not src.exists():continue
              out=dest/profile;out.mkdir(parents=True,exist_ok=True)
              for name in ("result.json","scanner-trace.json"):
                  if (src/name).exists():shutil.copyfile(src/name,out/name)
              pngs=sorted(src.glob("*.png"))
              critical=[p for p in pngs if any(k in p.name for k in (
                  "app-open","picker-open","picker-roots","picker-documents",
                  "picker-fixture","folder-selected","-started","-complete",
                  "metadata-editor","needs-attention","failure","WATCHDOG","TIMEOUT"))]
              sampled=[p for p in pngs if p.name.startswith(("discovery-","identification-"))]
              selected=[]
              for p in [*critical,*sampled[:1],*sampled[-1:]]:
                  if p not in selected:selected.append(p)
              for p in selected[:16]:shutil.copyfile(p,out/p.name)
          PY
          git config user.name "archivist-android-qa[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa-evidence/test23-android-emulator
          if ! git diff --cached --quiet; then
            git commit -m "test-evidence: original Test14 APK on 342 real Android MP3s"
            git push origin HEAD:refs/heads/test/test14-real-android-342-comparison-20261009
          fi
