name: Server checks

on:
  workflow_dispatch:
  push:
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'archivist/**'
      - 'home-assistant/archivist/**'
      - '.github/workflows/server-check.yml'

concurrency:
  group: server-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Root server tests
        run: |
          go mod tidy
          go test ./...

      - name: Packaged server tests
        run: |
          (cd archivist/app && go mod tidy && go test ./...)
          (cd home-assistant/archivist/app && go mod tidy && go test ./...)

      - name: Web JavaScript syntax
        run: |
          for dir in web archivist/app/web home-assistant/archivist/app/web; do
            for file in "$dir"/*.js; do
              node --check "$file"
            done
          done

      - name: Add-on launcher syntax
        run: |
          sh -n archivist/run.sh
          sh -n home-assistant/archivist/run.sh

      - name: Verify packaged source parity
        run: sh scripts/sync-packaged-server.sh --check

      - name: Home Assistant add-on smoke test
        run: |
          set -euo pipefail
          docker build --build-arg BUILD_VERSION=0.1.19 --build-arg BUILD_ARCH=amd64 -t archivist-ha-test home-assistant/archivist

          rm -rf .ci-data .ci-ssl
          mkdir -p .ci-data .ci-ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1             -keyout .ci-ssl/privkey.pem -out .ci-ssl/fullchain.pem             -subj '/CN=localhost' >/dev/null 2>&1
          cat > .ci-data/options.json <<'JSON'
          {
            "data_path": "/data",
            "listen": "0.0.0.0:5056",
            "allow_lan": true,
            "remote_https": true,
            "remote_listen": "0.0.0.0:5443",
            "certfile": "fullchain.pem",
            "keyfile": "privkey.pem"
          }
          JSON

          docker run -d --name archivist-ha-test-run             -p 15056:5056 -p 15443:5443             -v "$PWD/.ci-data:/data" -v "$PWD/.ci-ssl:/ssl:ro"             archivist-ha-test

          cleanup() {
            docker logs archivist-ha-test-run || true
            docker rm -f archivist-ha-test-run >/dev/null 2>&1 || true
            rm -rf .ci-data .ci-ssl
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15056/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15056/healthz
          curl -kfsS https://127.0.0.1:15443/healthz

