name: Server checks

on:
  workflow_dispatch:
  push:
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'scripts/ui-contract.cjs'
      - 'scripts/package-ha*'
      - 'repository.yaml'
      - 'archivist/**'
      - 'compose.yaml'
      - '.env.example'
      - '.gitignore'
      - 'DOCKER-DEPLOYMENT.md'
      - 'scripts/docker-compose-contract.test.cjs'
      - '.github/workflows/server-check.yml'
  pull_request:
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'scripts/ui-contract.cjs'
      - 'scripts/package-ha*'
      - 'repository.yaml'
      - 'archivist/**'
      - 'compose.yaml'
      - '.env.example'
      - 'DOCKER-DEPLOYMENT.md'
      - 'scripts/docker-compose-contract.test.cjs'
      - '.github/workflows/server-check.yml'

concurrency:
  group: server-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected Archivist features
        run: node scripts/v1-protection-gate.cjs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Root server tests
        run: |
          go mod tidy
          go test ./...

      - name: Packaged server tests
        run: |
          (cd archivist/app && go mod tidy && go test ./...)

      - name: Raspberry Pi ARM64 compile
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/archivist-root-arm64 .
          (cd archivist/app && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/archivist-package-arm64 .)
          grep -q -- '- aarch64' archivist/config.yaml

      - name: Web JavaScript syntax
        run: |
          for dir in web archivist/app/web; do
            for file in "$dir"/*.js; do
              node --check "$file"
            done
          done

      - name: UI wiring contract
        run: node scripts/ui-contract.cjs

      - name: Advanced manager contract
        run: node scripts/v1-manager-contract.test.cjs

      - name: Home Assistant package contract
        run: node scripts/package-ha.test.cjs

      - name: Add-on launcher syntax
        run: |
          sh -n archivist/run.sh

      - name: Verify packaged source parity
        run: |
          for file in *.go go.mod go.sum; do
            cmp "$file" "archivist/app/$file"
          done
          for file in index.html app.js style.css catalogue.js household.js filemoves.js organise.js reader.html reader.js reader.css speech-focus.js; do
            cmp "web/$file" "archivist/app/web/$file"
          done

      - name: Standalone Docker Compose contract
        env:
          ARCHIVIST_MEDIA_PATH: ${{ github.workspace }}
        run: |
          node scripts/docker-compose-contract.test.cjs
          docker compose -f compose.yaml config --quiet

      - name: Standalone Docker runtime and persistence smoke
        env:
          ARCHIVIST_MEDIA_PATH: ${{ runner.temp }}/archivist-ci-media
          ARCHIVIST_BIND_ADDRESS: 127.0.0.1
          ARCHIVIST_PORT: '15057'
        run: |
          set -euo pipefail
          mkdir -p "$ARCHIVIST_MEDIA_PATH"
          cleanup() {
            docker compose -f compose.yaml logs --tail=100 || true
            docker compose -f compose.yaml down -v --remove-orphans || true
          }
          trap cleanup EXIT
          docker compose -f compose.yaml up -d --build
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15057/healthz >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" = 1
          docker compose -f compose.yaml exec -T server sh -ec 'touch /data/archivist-ci-persistence-marker'
          if docker compose -f compose.yaml exec -T server sh -c 'touch /media/archivist-ci-forbidden-write >/dev/null 2>&1'; then
            echo 'FAIL: media mount is writable despite read_only configuration' >&2
            exit 1
          fi
          test ! -e "$ARCHIVIST_MEDIA_PATH/archivist-ci-forbidden-write"
          docker compose -f compose.yaml down
          docker compose -f compose.yaml up -d
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15057/healthz >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          test "$healthy" = 1
          docker compose -f compose.yaml exec -T server test -f /data/archivist-ci-persistence-marker

      - name: Home Assistant add-on smoke test
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/ {print $2; exit}' archivist/config.yaml)
          test -n "$VERSION"
          docker build --build-arg BUILD_VERSION="$VERSION" --build-arg BUILD_ARCH=amd64 -t archivist-ha-test archivist

          rm -rf .ci-data .ci-ssl
          mkdir -p .ci-data .ci-ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1             -keyout .ci-ssl/privkey.pem -out .ci-ssl/fullchain.pem             -subj '/CN=localhost' >/dev/null 2>&1
          cat > .ci-data/options.json <<'JSON'
          {
            "data_path": "/data",
            "listen": "0.0.0.0:5056",
            "allow_lan": true,
            "remote_https": true,
            "remote_listen": "0.0.0.0:5443",
            "certfile": "fullchain.pem",
            "keyfile": "privkey.pem"
          }
          JSON

          docker run -d --name archivist-ha-test-run             -p 15056:5056 -p 15443:5443             -v "$PWD/.ci-data:/data" -v "$PWD/.ci-ssl:/ssl:ro"             archivist-ha-test

          cleanup() {
            docker logs archivist-ha-test-run || true
            docker rm -f archivist-ha-test-run >/dev/null 2>&1 || true
            rm -rf .ci-data .ci-ssl
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:15056/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:15056/healthz
          curl -kfsS https://127.0.0.1:15443/healthz


  arm64-smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ARCHIVIST_MEDIA_PATH: ${{ github.workspace }}/Archivist NAS share - Books
      ARCHIVIST_SECONDARY_MEDIA: ${{ github.workspace }}/Archivist NFS share - Audiobooks
      ARCHIVIST_BIND_ADDRESS: 127.0.0.1
      ARCHIVIST_PORT: '15058'
      ARCHIVIST_VERSION: arm64-ci
      COMPOSE_PROJECT_NAME: archivist-arm64-ci
    steps:
      - uses: actions/checkout@v5

      - name: Verify protected app source and standalone contract
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          node scripts/v1-protection-gate.cjs
          node scripts/docker-compose-contract.test.cjs

      - name: Prepare two isolated NAS-style source folders
        run: |
          set -euo pipefail
          mkdir -p "$ARCHIVIST_MEDIA_PATH/Fiction collection" "$ARCHIVIST_SECONDARY_MEDIA"
          printf 'Read-only, synthetic file. No user content.\n' > "$ARCHIVIST_MEDIA_PATH/Fiction collection/sample.txt"
          printf 'Secondary synthetic volume.\n' > "$ARCHIVIST_SECONDARY_MEDIA/sample.txt"
          cat > "$RUNNER_TEMP/arm64-nas.override.yaml" <<'YAML'
          services:
            server:
              volumes:
                - type: bind
                  source: ${ARCHIVIST_SECONDARY_MEDIA:?Set a secondary host media directory}
                  target: /media-external
                  read_only: true
                  bind:
                    create_host_path: false
          YAML

      - name: Validate resolved storage contract
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f "$RUNNER_TEMP/arm64-nas.override.yaml" config --format json > "$RUNNER_TEMP/arm64-compose.json"
          python3 - <<'PY'
          import json, os
          with open(os.path.join(os.environ['RUNNER_TEMP'],'arm64-compose.json'), encoding='utf-8') as f:
              c=json.load(f)
          service=c['services']['server']
          volumes={v['target']:v for v in service['volumes']}
          assert set(('/data','/media','/media-external')).issubset(volumes), volumes
          assert volumes['/data']['type']=='volume'
          for target in ('/media','/media-external'):
              assert volumes[target]['type']=='bind'
              assert bool(volumes[target]['read_only']) is True
              assert volumes[target].get('bind',{}).get('create_host_path',False) is False
          ports=service['ports']
          assert len(ports)==1 and ports[0]['host_ip']=='127.0.0.1',ports
          print('PASS: ARM64 NAS-style Compose preserves /data, both read-only mounts, and loopback binding')
          PY

      - name: Build and exercise native ARM64 container
        run: |
          set -euo pipefail
          compose() { docker compose -f compose.yaml -f "$RUNNER_TEMP/arm64-nas.override.yaml" "$@"; }
          cleanup() {
            compose logs --tail=100 || true
            compose down -v --remove-orphans || true
          }
          trap cleanup EXIT
          compose up -d --build
          test "$(compose exec -T server uname -m | tr -d '\r')" = aarch64
          ready=0
          for i in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:15058/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          compose exec -T server test -r '/media/Fiction collection/sample.txt'
          compose exec -T server test -r /media-external/sample.txt
          if compose exec -T server sh -c 'touch /media/forbidden-write >/dev/null 2>&1'; then
            echo 'FAIL: primary NAS-style media source is writable' >&2
            exit 1
          fi
          if compose exec -T server sh -c 'touch /media-external/forbidden-write >/dev/null 2>&1'; then
            echo 'FAIL: secondary NAS-style media source is writable' >&2
            exit 1
          fi
          test ! -e "$ARCHIVIST_MEDIA_PATH/forbidden-write"
          test ! -e "$ARCHIVIST_SECONDARY_MEDIA/forbidden-write"
          compose exec -T server sh -c "printf 'persisted' > /data/arm64-ci-persistence-marker"
          compose down
          compose up -d
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --show-error --fail http://127.0.0.1:15058/healthz >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          compose exec -T server grep -q persisted /data/arm64-ci-persistence-marker
          compose down
          missing="$RUNNER_TEMP/archivist-ci-missing-media-root"
          test ! -e "$missing"
          original_media="$ARCHIVIST_MEDIA_PATH"
          export ARCHIVIST_MEDIA_PATH="$missing"
          if compose up -d --no-build; then
            echo 'FAIL: container started with an absent required media mount' >&2
            exit 1
          fi
          test ! -e "$missing"
          export ARCHIVIST_MEDIA_PATH="$original_media"
          echo 'PASS: native ARM64 runtime, NAS-style read-only mounts, health, persistence, and missing-root safety'

