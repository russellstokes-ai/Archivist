name: Fresh scanner Fold test APK
on:
  push:
    branches: ['feature/archivist-scanner-vnext-real-library', 'feature/archivist-metadata-review']
    paths: ['.github/workflows/scanner-fold-test-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: scanner-fold-test-apk
  cancel-in-progress: false
jobs:
  fold-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Verify source and mobile checks
        working-directory: mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install --no-audit --no-fund
          node harden-forge.cjs
          npm run typecheck
          npm test
      - name: Check Android compatibility
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Build isolated Fold test APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Verify package, signing and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scanner-fold-delivery
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > scanner-fold-delivery/package.txt
          grep -q "name='app.archivist.reader.scanneracceptance'" scanner-fold-delivery/package.txt
          grep -q "native-code:.*'arm64-v8a'" scanner-fold-delivery/package.txt
          cp "$APK" scanner-fold-delivery/Archivist-Fresh-Scanner-Fold-Test-20261010-${SOURCE_SHA:0:7}.apk
          cd scanner-fold-delivery
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source: %s\nPhysical Fold test build: folder grouping, non-book filtering, background Assist, per-book metadata review, global Organise panel and bounded destination checks.\nAutomated checks: mobile suites, typecheck, release lint, package, signature and alignment. No emulator run for this build at user request. Phone behaviour, live provider matching and performance still require physical acceptance.\nUpdates the isolated app.archivist.reader.scanneracceptance test package. Existing test data remains; rescan to regroup it.\n' "$SOURCE_SHA" > TEST-NOTES.txt
      - name: Provide direct test APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=scanner-vnext-fold-fix-20261010-${SOURCE_SHA:0:7}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title 'Archivist Fresh Scanner — unvalidated Fold test' --notes-file scanner-fold-delivery/TEST-NOTES.txt
          gh release upload "$TAG" scanner-fold-delivery/*.apk scanner-fold-delivery/SHA256SUMS.txt scanner-fold-delivery/TEST-NOTES.txt --clobber
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-scanner-phone-fix-${{ github.sha }}
          path: |
            scanner-fold-delivery/
            mobile/android/app/build/reports/lint-results-release.*
          retention-days: 14
