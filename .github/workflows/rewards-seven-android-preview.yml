name: Archivist seven Rewards animations Android test APK
on:
  push:
    branches: ['release/rewards-seven-lottie-android-qa-20261011']
    paths:
      - '.github/workflows/rewards-seven-android-preview.yml'
      - 'mobile/LivePlayerSkipIcon.tsx'
      - 'mobile/live-player-skip-icons.test.cjs'
      - 'mobile/live-player-skip-burst-runtime.test.cjs'
      - 'mobile/ArchivistBookLoader.tsx'
      - 'mobile/LivePlayerPlayPauseMorph.tsx'
      - 'mobile/MiniAudioWaveform.tsx'
      - 'mobile/book-loader-consistency.test.cjs'
      - 'mobile/mini-audio-waveform.test.cjs'
      - 'mobile/AchievementRewardOverlay.tsx'
      - 'mobile/rewardMotion.ts'
      - 'mobile/reward-motion-acceptance.test.cjs'
      - 'mobile/assets/motion/rewards/**'
      - 'docs/REWARDS_LOTTIE_CHECKPOINT_2026-10-11.md'
      - 'mobile/android/app/build.gradle'
      - 'mobile/readerAccessErrors.ts'
      - 'mobile/comic-webview-access-regression.test.cjs'
      - 'docs/scanner-vnext/UI_BINDING_EXCEPTIONS.json'
      - 'mobile/assets/motion/live-forward-media-ink.json'
      - 'mobile/assets/motion/live-forward-media-source.json'
      - 'mobile/App.tsx'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: rewards-seven-qa-20261011
  cancel-in-progress: false
jobs:
  ui-motion-commercial-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Refuse unrelated code changes against accepted canonical
        run: |
          set -euo pipefail
          BASE=df4c39b44394d8c512ca0298bffa7f19da356490
          git cat-file -e "$BASE^{commit}"
          git diff --name-only "$BASE" HEAD > /tmp/ui-motion-changes.txt
          while IFS= read -r changed; do
            case "$changed" in
              mobile/App.tsx|mobile/LivingBookCanvas.tsx|mobile/LocalPdfReader.tsx|mobile/android/app/build.gradle|mobile/package.json|mobile/package-lock.json|mobile/*loader*.test.cjs|mobile/*motion*.test.cjs|mobile/*waveform*.test.cjs|mobile/*skip*.test.cjs|mobile/live-player-play-pause-morph.test.cjs|mobile/living-book-render-scale.test.cjs|mobile/scanner-vnext-process-lock.test.cjs|mobile/test10-1-living-book-reentry.test.cjs|mobile/ui-contract.test.cjs|mobile/ArchivistBookLoader.tsx|mobile/LivePlayerPlayPauseMorph.tsx|mobile/LivePlayerSkipIcon.tsx|mobile/MiniAudioWaveform.tsx|mobile/readerAccessErrors.ts|mobile/comic-webview-access-regression.test.cjs|mobile/AchievementRewardOverlay.tsx|mobile/rewardMotion.ts|mobile/reward-motion-acceptance.test.cjs|mobile/assets/motion/*|docs/scanner-vnext/UI_BINDING_EXCEPTIONS.json|docs/ARCHIVIST_BASIC_UI_ANIMATIONS_CHECKPOINT_2026-10-11.md|docs/REWARDS_LOTTIE_CHECKPOINT_2026-10-11.md|.github/workflows/*) ;;
              *) echo "UNAPPROVED FILE CHANGED: $changed"; exit 1 ;;
            esac
          done < /tmp/ui-motion-changes.txt
          echo "Scoped source-file audit passed"
      - name: Verify source and mobile checks
        working-directory: mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm ci --no-audit --no-fund
          node harden-forge.cjs
          npm run typecheck
          npm test
      - name: Check Android compatibility
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease -PrewardPreview=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Build isolated Fold test APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PrewardPreview=true -PreactNativeArchitectures=arm64-v8a --console=plain
      - name: Verify package, signing and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rewards-seven-qa-delivery
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > rewards-seven-qa-delivery/package.txt
          grep -q "name='app.archivist.reader.rewardsqa'" rewards-seven-qa-delivery/package.txt
          grep -q "native-code:.*'arm64-v8a'" rewards-seven-qa-delivery/package.txt
          cp "$APK" rewards-seven-qa-delivery/Archivist-Rewards-Seven-${SOURCE_SHA:0:7}.apk
          cd rewards-seven-qa-delivery
          sha256sum *.apk > SHA256SUMS.txt
          printf 'Source: %s\nRewards QA: seven approved LottieFiles reward animation sources, native playback speed, optical scaling, non-looping, held final frames, format-specific award mappings, rare fireworks, and portrait Play/Pause optical alignment. Includes previous five UI animations and local comic WebView access handling, but comic ERR_ACCESS_DENIED is NOT yet confirmed fixed on device.\nAutomated checks: mobile suites, typecheck, release lint, package, signature and alignment. Device acceptance required: trigger legitimate rewards on phone/Fold and check 96/112dp layouts, natural speeds, held frames, 3-second minimum presentation (4-5s original assets finish naturally), level confetti, overlays and prestige rarity. Portrait icon alignment needs verification; comic ERR_ACCESS_DENIED remains unresolved.\nUses unique isolated app.archivist.reader.rewardsqa package; cannot overwrite the canonical app or scanner-acceptance app; separate empty test data.\n' "$SOURCE_SHA" > TEST-NOTES.txt
      - name: Provide direct test APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=rewards-seven-qa-${SOURCE_SHA:0:7}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$SOURCE_SHA" --prerelease --title 'Archivist Rewards — all seven Lottie animations + UI review' --notes-file rewards-seven-qa-delivery/TEST-NOTES.txt
          gh release upload "$TAG" rewards-seven-qa-delivery/*.apk rewards-seven-qa-delivery/SHA256SUMS.txt rewards-seven-qa-delivery/TEST-NOTES.txt --clobber
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewards-seven-qa-${{ github.sha }}
          path: |
            rewards-seven-qa-delivery/
            mobile/android/app/build/reports/lint-results-release.*
          retention-days: 14
