name: Probe approved LottieFiles asset source
on:
  push:
    branches: ['feat/live-player-pause-play-lottie-prototype-20261011']
    paths: ['.github/workflows/probe-play-pause-asset.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect user-approved LottieFiles page metadata
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          url='https://lottiefiles.com/free-animation/pause-play-ThGRBFYJSo'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125 Safari/537.36'})
          try:
              with urllib.request.urlopen(req,timeout=25) as f:
                  data=f.read(1000000).decode('utf-8','replace')
                  print('HTTP status',f.status,'length',len(data),'type',f.headers.get('content-type'))
          except Exception as e:
              print('FETCH_ERROR',type(e).__name__,str(e)[:200])
              raise
          for term in ('__NEXT_DATA__','application/ld+json','ThGRBFYJSo','b6ZZJKDfU4','84930ac2','animationData','download','application/json','lottie_url','file_url','assetUrl'):
              i=data.lower().find(term.lower())
              print('TERM',term,'offset',i,'excerpt',data[max(0,i-140):i+230].replace('\\n',' ')[:370] if i>=0 else '')
          urls=re.findall(r'https?[^"<>\\s]{2,200}',data)
          for val in dict.fromkeys(urls):
              if ('lottie' in val or '.json' in val or 'asset' in val):
                  print('REF',val[:220])
          import html
          blob=html.unescape(data).replace('\\\\/','/')
          for term in ('animation_url','animationUrl','animation_url','jsonUrl','json_url','downloadUrl','assetPath','source_url','publicUrl','original_file','originalFile','lottie.host','graphql.lottiefiles','ThGRBFYJSo','b6ZZJKDfU4','"animation"','"animations"','"assetUrl"'):
              offsets=[m.start() for m in re.finditer(re.escape(term),blob,re.I)]
              print('FIND',term,len(offsets))
              for i in offsets[:3]:
                  print('AT',i,repr(blob[max(0,i-150):i+320])[:500])
          for pattern in (r'https?://[^"\\s<>]{5,400}\\.(?:json|lottie)(?:\\?[^"\\s<>]{0,200})?',r'https?://[^"\\s<>]{5,300}lottie[^"\\s<>]{0,100}'):
              vals=list(dict.fromkeys(re.findall(pattern,blob,re.I)))
              print('URL_MATCHES',len(vals))
              for u in vals[:18]: print('URL',u[:350])
          print('--- HYDRATION TERMS ---')
          for term in ('84930ac2-1151-11ee-992a-3f09814c2209','ThGRBFYJSo','b6ZZJKDfU4','.lottie','animationFile','downloadFile','fileUrl','fileName','animationSrc','animationFileUrl','jsonFile','sourceUrl'):
              indices=[m.start() for m in re.finditer(re.escape(term),data,re.I)]
              print('LOOK',term,'count',len(indices))
              for i in indices[-4:]:
                  print('DETAIL',term,i,repr(data[max(0,i-220):i+500])[:750])
          PY
