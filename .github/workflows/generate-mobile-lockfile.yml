name: Generate mobile lockfile

on:
  push:
    branches:
      - review/0.9.5-test13-hardening
    paths:
      - '.github/workflows/generate-mobile-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: review/0.9.5-test13-hardening

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate exact SDK 55 npm lock
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lock metadata
        working-directory: mobile
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(lock.name!==pkg.name || lock.version!==pkg.version) throw new Error('Lockfile package metadata mismatch');
          if(lock.packages?.['']?.version!==pkg.version) throw new Error('Root lockfile version mismatch');
          console.log('Generated lockfile for',pkg.name,pkg.version);
          NODE

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "Generate reproducible 0.9.5 SDK55 lockfile"
          git push origin HEAD:review/0.9.5-test13-hardening
