name: Fresh scanner whole-app acceptance
on:
  push:
    branches: ['feature/archivist-scanner-vnext-real-library']
    paths: ['.github/workflows/scanner-app-acceptance.yml', '.github/scripts/scanner-app-acceptance.py', '.github/scripts/scanner-launch-smoke.py', 'mobile/android/app/src/main/java/app/archivist/reader/Scanner*.java']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scanner-app-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install playable fixture generator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install and verify current mobile code
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs
          npm run typecheck
          npm test
      - name: Build isolated candidate for emulator only
        working-directory: mobile/android
        run: |
          ./gradlew :app:lintRelease -PscannerAcceptance=true --console=plain
          ./gradlew :app:assembleRelease -PscannerAcceptance=true --console=plain
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the actual app and Android folder picker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 .github/scripts/scanner-launch-smoke.py mobile/android/app/build/outputs/apk/release/app-release.apk
            python3 .github/scripts/scanner-app-acceptance.py mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Save evidence without distributing an ungated APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-app-evidence-${{ github.sha }}
          path: |
            mobile/android/app/build/reports/lint-results-release.*
            mobile/android/app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            scanner-app-results/*.json
            scanner-app-results/*.xml
            scanner-app-results/*.png
            scanner-app-results/*.txt
            scanner-app-results/*.log
          retention-days: 7
