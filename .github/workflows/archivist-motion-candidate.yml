name: Archivist Commercial Motion Test APK
on:
  push:
    branches: ['polish/archivist-commercial-final-pass-20261011']
    paths: ['mobile/**', '.github/workflows/archivist-motion-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: archivist-motion-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Verify protected mobile app and all tests
        working-directory: mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install --no-audit --no-fund
          node harden-forge.cjs
          npm run typecheck
          node scanner-vnext-canonical-lock.test.cjs
          node scanner-vnext-process-lock.test.cjs
          node scanner-vnext-ui-binding.test.cjs
          node ui-contract.test.cjs
          npm test
      - name: Build ARM64 isolated Android release candidate
        working-directory: mobile/android
        run: |
          ./gradlew :app:lintRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain
          ./gradlew :app:assembleRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain
      - name: Verify package and APK checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p commercial-motion-delivery
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          B="$ANDROID_HOME/build-tools/36.0.0"
          "$B/apksigner" verify --verbose "$APK"
          "$B/zipalign" -c -P 16 4 "$APK"
          "$B/aapt" dump badging "$APK" > commercial-motion-delivery/package.txt
          grep -q "name='app.archivist.reader.scanneracceptance'" commercial-motion-delivery/package.txt
          grep -q "native-code:.*'arm64-v8a'" commercial-motion-delivery/package.txt
          cp "$APK" "commercial-motion-delivery/Archivist-Commercial-Motion-Test-20261011-${SOURCE_SHA:0:7}.apk"
          (cd commercial-motion-delivery && sha256sum *.apk > SHA256SUMS.txt)
          printf 'Source %s\nMotion test APK, NOT commercial release. Canonical df4c39b unchanged. Physical Fold acceptance pending. Isolated package.\n' "$SOURCE_SHA" > commercial-motion-delivery/TEST-NOTES.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: archivist-commercial-motion-${{ github.sha }}
          path: commercial-motion-delivery/
          retention-days: 14
