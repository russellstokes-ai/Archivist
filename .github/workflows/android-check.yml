name: Android native checks

# Build 6 release gate: this workflow is intentionally triggered alongside APK validation.
# Final Test 6 same-SHA gate.

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/qa-signing-contract.test.cjs'
      - 'scripts/check-16kb-native-libs.cjs'
      - 'scripts/test-check-16kb-native-libs.cjs'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-emulator-smoke.sh'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/qa-signing-contract.test.cjs'
      - 'scripts/check-16kb-native-libs.cjs'
      - 'scripts/test-check-16kb-native-libs.cjs'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-emulator-smoke.sh'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

concurrency:
  group: android-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Verify protected Archivist features
        run: node scripts/v1-protection-gate.cjs

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs
          node patch-gradle-toolchain.cjs

      - name: Native and QA-signing contract tests
        working-directory: mobile
        run: |
          node native-patch.test.cjs
          node qa-signing-contract.test.cjs
          node ../scripts/test-check-16kb-native-libs.cjs

      - name: Verify real audio metadata and chapter preservation
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          curl --fail --location --max-time 60 https://jitpack.io/com/github/Adonai/jaudiotagger/2.3.14/jaudiotagger-2.3.14.jar -o /tmp/archivist-audio-tagger.jar
          echo '1d2827c514832ab2a30a0ae4f969e571247dcfbed5b5a258f226e3e2a07da4e0  /tmp/archivist-audio-tagger.jar' | sha256sum --check
          AUDIO_TAGGER_JAR=/tmp/archivist-audio-tagger.jar node mobile/test-support/audio-metadata/verify.cjs

      - name: Verify CBR metadata against independent RAR extraction
        run: |
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/com/github/junrar/junrar/8.1.1/junrar-8.1.1.jar -o /tmp/archivist-junrar.jar
          curl --fail --location --max-time 60 https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar -o /tmp/archivist-slf4j.jar
          echo '2de9ef91a179b40138c1480d16cecc63bce86de5076f5136c4598ad78ff9200e  /tmp/archivist-junrar.jar' | sha256sum --check
          echo 'e7c2a48e8515ba1f49fa637d57b4e2f590b3f5bd97407ac699c3aa5efb1204a9  /tmp/archivist-slf4j.jar' | sha256sum --check
          JUNRAR_JAR=/tmp/archivist-junrar.jar SLF4J_JAR=/tmp/archivist-slf4j.jar node mobile/test-support/rar-metadata/verify.cjs

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Merge Android manifest
        working-directory: mobile/android
        run: ./gradlew :app:processDebugMainManifest --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Release lint before APK approval
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a,x86_64 -ParchivistQATest=true

      - name: Enable KVM for native CB7 verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify CB7 with Android JNI and generated real archives
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash .github/scripts/cb7-native-check.sh
