name: Android native checks

# Build 6 release gate: this workflow is intentionally triggered alongside APK validation.
# Final Test 6 same-SHA gate.

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

concurrency:
  group: android-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs

      - name: Native contract tests
        working-directory: mobile
        run: node native-patch.test.cjs

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Merge Android manifest
        working-directory: mobile/android
        run: ./gradlew :app:processDebugMainManifest --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
