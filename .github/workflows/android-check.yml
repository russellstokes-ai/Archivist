name: Android native checks

# Build 6 release gate: this workflow is intentionally triggered alongside APK validation.
# Final Test 6 same-SHA gate.

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/qa-signing-contract.test.cjs'
      - 'scripts/check-16kb-native-libs.cjs'
      - 'scripts/test-check-16kb-native-libs.cjs'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-emulator-smoke.sh'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/package.json'
      - 'mobile/app.json'
      - 'mobile/native-patch.test.cjs'
      - 'mobile/qa-signing-contract.test.cjs'
      - 'scripts/check-16kb-native-libs.cjs'
      - 'scripts/test-check-16kb-native-libs.cjs'
      - '.github/workflows/android-apk.yml'
      - '.github/scripts/android-emulator-smoke.sh'
      - 'mobile/sprint10-android-auto.test.cjs'
      - 'mobile/sprint10-final-release-gate.test.cjs'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

concurrency:
  group: android-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Verify protected Archivist features
        run: node scripts/v1-protection-gate.cjs

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Install mobile dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node harden-forge.cjs

      - name: Native and QA-signing contract tests
        working-directory: mobile
        run: |
          node native-patch.test.cjs
          node qa-signing-contract.test.cjs
          node ../scripts/test-check-16kb-native-libs.cjs

      - name: Verify real audio metadata and chapter preservation
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          curl --fail --location --max-time 60 https://jitpack.io/com/github/Adonai/jaudiotagger/2.3.14/jaudiotagger-2.3.14.jar -o /tmp/archivist-audio-tagger.jar
          echo '1d2827c514832ab2a30a0ae4f969e571247dcfbed5b5a258f226e3e2a07da4e0  /tmp/archivist-audio-tagger.jar' | sha256sum --check
          AUDIO_TAGGER_JAR=/tmp/archivist-audio-tagger.jar node mobile/test-support/audio-metadata/verify.cjs

      - name: Compile Android Kotlin
        working-directory: mobile/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      - name: Merge Android manifest
        working-directory: mobile/android
        run: ./gradlew :app:processDebugMainManifest --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
