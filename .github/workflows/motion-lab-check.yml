name: Archivist isolated Motion Lab checks
on:
  push:
    paths:
      - 'motion-lab/**'
      - 'mobile/assets/motion/**'
      - 'mobile/motion-assets.test.cjs'
      - '.github/workflows/motion-lab-check.yml'
  pull_request:
    paths:
      - 'motion-lab/**'
      - 'mobile/assets/motion/**'
      - 'mobile/motion-assets.test.cjs'
      - '.github/workflows/motion-lab-check.yml'

concurrency:
  group: archivist-motion-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install isolated dependencies
        working-directory: motion-lab
        run: npm install --no-audit --no-fund
      - name: Check Expo compatibility
        working-directory: motion-lab
        run: npx expo-doctor
      - name: Typecheck preview
        working-directory: motion-lab
        run: npm run typecheck
      - name: Generate independent Android project
        working-directory: motion-lab
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compile native Motion Lab preview
        working-directory: motion-lab/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a
