name: Core CI

on:
  push:
    branches: [main, server/parity-0.9.4-20261004]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify packaged server parity
        shell: bash
        run: |
          set -euo pipefail
          for file in *.go go.mod go.sum; do
            cmp -- "$file" "archivist/app/$file"
          done
          for file in index.html app.js style.css catalogue.js household.js filemoves.js organise.js reader.html reader.js reader.css speech-focus.js assets/LibreCaslonText.ttf assets/OFL.txt; do
            cmp -- "web/$file" "archivist/app/web/$file"
          done
          echo "Root and canonical Home Assistant package are aligned."

      - name: Home Assistant package contract
        run: node scripts/package-ha.test.cjs

      - name: Browser syntax and UI contract
        shell: bash
        run: |
          set -euo pipefail
          for file in web/*.js; do
            node --check "$file"
          done
          node scripts/ui-contract.cjs
          node playback_test.cjs

      - name: Test all server packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in "." "archivist/app"; do
            echo "Testing $dir"
            (
              cd "$dir"
              go mod tidy
              go test ./...
            )
          done

      - name: Verify module files stay clean
        run: |
          git diff --exit-code --             go.mod go.sum             archivist/app/go.mod archivist/app/go.sum

  browser-ui:
    name: Browser UI with fixture library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/archivist-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/archivist-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise responsive browsing and recovery
        run: |
          NODE_PATH="$RUNNER_TEMP/archivist-browser/node_modules" ARCHIVIST_SCREENSHOTS="$RUNNER_TEMP/archivist-screenshots" node scripts/browser-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-ui-screenshots
          path: ${{ runner.temp }}/archivist-screenshots
          if-no-files-found: ignore

  mobile:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: |
          npm ci
          node harden-forge.cjs

      - name: Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Runtime dependency audit
        working-directory: mobile
        run: node audit-runtime.cjs

      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Unit and contract tests
        working-directory: mobile
        run: npm test

