name: Archivist commercial polish preview APK
on:
  push:
    branches: ['feat/commercial-motion-and-reliability-20261011']
    paths: ['.github/workflows/commercial-polish-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archivist-commercial-polish-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install and validate source
        working-directory: mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm install --no-audit --no-fund
          node harden-forge.cjs
          npx expo-doctor
          npm run typecheck
          npm test
      - name: Release lint for isolated acceptance package
        working-directory: mobile/android
        run: ./gradlew :app:lintRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain
      - name: Build isolated acceptance APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PscannerAcceptance=true -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain
      - name: Verify and name immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p commercial-preview
          APK=mobile/android/app/build/outputs/apk/release/app-release.apk
          SDK="$ANDROID_HOME/build-tools/36.0.0"
          "$SDK/apksigner" verify --verbose "$APK"
          "$SDK/zipalign" -c -P 16 4 "$APK"
          "$SDK/aapt" dump badging "$APK" > commercial-preview/package.txt
          grep -q "name='app.archivist.reader.scanneracceptance'" commercial-preview/package.txt
          grep -q "native-code:.*'arm64-v8a'" commercial-preview/package.txt
          cp "$APK" "commercial-preview/Archivist-Commercial-Polish-Preview-${SOURCE_SHA:0:7}.apk"
          cd commercial-preview
          sha256sum *.apk > SHA256SUMS.txt
          printf 'EXPERIMENTAL physical test APK; not commercial release or verified Fold acceptance.\nSource SHA %s\nChanges: approved Living Book OUTER resize only; original renderer fully guarded; one-time first-library celebration fix; local production Lottie scanner, Play/Pause, waveform and reward assets (Reduced Motion supported).\nScanner, onboarding and Fold canonical locks unchanged.\nPackage app.archivist.reader.scanneracceptance may UPDATE previous scanner-acceptance installation and its data; back up test data before installing.\nFollow docs/ARCHIVIST_COMMERCIAL_TEST_HANDOFF_2026-10-11.md on this commit for device acceptance.\n' "$SOURCE_SHA" > TEST-NOTES.txt
      - name: Publish SHA-identified test prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="archivist-commercial-test-${SOURCE_SHA:0:7}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SOURCE_SHA" --prerelease \
              --title "Archivist Commercial Motion Test ${SOURCE_SHA:0:7} — unvalidated" \
              --notes-file commercial-preview/TEST-NOTES.txt
          fi
          gh release upload "$TAG" commercial-preview/*.apk \
            commercial-preview/SHA256SUMS.txt commercial-preview/package.txt \
            commercial-preview/TEST-NOTES.txt --clobber
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archivist-commercial-preview-${{ github.sha }}
          path: |
            commercial-preview/
            mobile/android/app/build/reports/lint-results-release.*
          retention-days: 21
