name: Archivist
slug: archivist
description: Privacy-first self-hosted library server for ebooks, audiobooks, comics and PDFs.
version: 0.1.4-dev
url: https://github.com/russellstokes-ai/Archivist
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 5056
panel_icon: mdi:bookshelf
watchdog: http://[HOST]:[PORT:5056]/healthz
ports:
  5056/tcp: 5056
ports_description:
  5056/tcp: Archivist web interface and API
map:
  - media:rw
  - share:rw
  - backup:rw
options:
  data_path: /data
  listen: 0.0.0.0:5056
  allow_lan: true
schema:
  data_path: str
  listen: str
  allow_lan: bool
