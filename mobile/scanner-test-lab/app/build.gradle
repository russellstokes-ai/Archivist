plugins { id 'com.android.application' }
android {
    namespace 'app.archivist.scannerlab'
    compileSdk 36
    defaultConfig {
        applicationId 'app.archivist.scannerlab'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName 'native-test-only'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java {
        srcDirs = ['src/main/java', '../../android/app/src/main/java']
        include '**/ScannerTaskPool.java', '**/ScannerBoundedIO.java', '**/ScannerDocumentAccess.java', '**/FixtureDocumentsProvider.java'
    }
}
dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
