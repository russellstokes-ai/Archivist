plugins { id 'com.android.application' }
def scannerSources = layout.buildDirectory.dir('generated/scanner-source')
def copyScannerSources = tasks.register('copyScannerSources', Sync) {
    from(file('../../android/app/src/main/java/app/archivist/reader')) {
        include 'ScannerTaskPool.java', 'ScannerBoundedIO.java', 'ScannerDocumentAccess.java', 'ScannerArchiveReader.java'
    }
    into scannerSources
}
tasks.withType(JavaCompile).configureEach { dependsOn copyScannerSources }
android {
    namespace 'app.archivist.scannerlab'
    compileSdk 36
    defaultConfig {
        applicationId 'app.archivist.scannerlab'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName 'native-test-only'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java {
        srcDirs = ['src/main/java', scannerSources.get().asFile]
    }
}
dependencies {
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
